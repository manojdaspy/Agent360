<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f9fafb;
      color: #111827;
    }
    .header {
      background: #1e40af;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header span { font-size: 20px; }
    .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 11px; color: #6b7280; font-weight: 500; margin-bottom: 4px; display: block; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      background: white;
    }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      width: 36px; height: 20px;
      background: #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      border: none;
    }
    .toggle.on { background: #22c55e; }
    .toggle::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      background: white;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: left 0.2s;
    }
    .toggle.on::after { left: 19px; }
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      width: 100%;
    }
    .btn-primary { background: #1e40af; color: white; }
    .btn-primary:hover { background: #1d3faa; }
    .btn-test { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-test:hover { background: #e5e7eb; }
    .status {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .status.ok    { background: #f0fdf4; color: #166534; border: 1px solid #86efac; display: block; }
    .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
    .footer { padding: 10px 16px; border-top: 1px solid #e5e7eb; font-size: 10px; color: #9ca3af; }
  </style>
</head>
<body>

<div class="header">
  <span>🛠️</span>
  <h1>VibesCode Agent</h1>
</div>

<div class="body">

  <div>
    <label>BASE URL</label>
    <input type="text" id="baseUrl" placeholder="https://studentassignment.lyralogics.com">
  </div>

  <div>
    <label>API TOKEN</label>
    <input type="password" id="token" placeholder="your-secret-token">
  </div>

  <div class="toggle-row">
    <label style="margin:0">Extension enabled</label>
    <button class="toggle on" id="enabledToggle"></button>
  </div>

  <div class="toggle-row">
    <label style="margin:0">Debug mode (console logs)</label>
    <button class="toggle" id="debugToggle"></button>
  </div>

  <button class="btn btn-primary" id="saveBtn">💾 Save Settings</button>
  <button class="btn btn-test"    id="testBtn">🔌 Test Connection</button>

  <div class="status" id="statusMsg"></div>

</div>

<div class="footer">
  Watching for __AGENT_CALL__ markers in chat
</div>

<script src="popup.js"></script>
</body>
</html>
